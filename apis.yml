apis:
- aid: casavo:virtual-tools
  name: Casavo Virtual Tools (Realisti.co) API
  description: >-
    Versioned REST API behind Realisti.co, the virtual-tour and property-imaging platform Casavo
    operates as Casavo Virtual Tools. Casavo's own help centre documented it as the integration
    path for estate agencies and property-management software: create an (empty) virtual tour,
    retrieve the URL of an existing tour, and activate or deactivate a tour. The v4 collection
    index is served anonymously and lists 28 resource collections — house, floor, view, target,
    poi and their draft counterparts, photo, photozipball, analytics, plans, agency, agencyplan,
    agencyprofile, agentgroup, agent, apikey, category, auth, userprofile, subscribe and the sync
    endpoints. Every collection itself answers 401 without credentials; v2 and v3 remain live
    alongside v4. No OpenAPI, Swagger, GraphQL SDL or AsyncAPI is published, and the documentation
    URL Casavo published (editor.realisti.co/api/v4/docs/) now returns 404.
  humanURL: https://editor.realisti.co/
  baseURL: https://editor.realisti.co/api/v4/
