aid: casavo
name: Casavo
description: >-
  Casavo Management S.p.A. is an Italian proptech company founded in Milan in 2017 by Giorgio
  Tinacci that operates a digital residential real estate platform across Italy, Spain, France and
  Portugal. It began as an iBuyer — instantly valuing, buying, renovating and reselling homes — and
  has since shifted to a marketplace and brokerage model that connects sellers, buyers and partner
  estate agents, wrapping the transaction in mortgage brokerage, document management and renovation
  services. Casavo's developer-facing surface is not its consumer marketplace but the virtual-tour
  platform it acquired, Realisti.co (marketed as Casavo Virtual Tools): a versioned REST API at
  editor.realisti.co that lets partner agencies and property-management software create virtual
  tours, retrieve tour URLs, and activate or deactivate a tour at the end of a mandate. The company
  also runs a public GitHub organization of DevOps tooling, Helm charts, Terraform modules and the
  Habitat design system, and an engineering blog.
