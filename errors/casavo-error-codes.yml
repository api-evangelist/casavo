rfc9457_note: >-
  Errors are returned as `application/json`, not `application/problem+json`, and carry no `type`,
  `title`, `status`, `detail` or `instance` members in the RFC 9457 sense. The envelope is a
  Django REST Framework body wrapped in a custom three-key structure.
envelope:
  content_type: application/json
  shape:
    data:
      detail: Human-readable message (DRF's native error body, nested).
    code: Machine-readable slug for the failure, or the HTTP status as a string.
    main_error: Duplicate of the human-readable message, promoted to the top level.
  example_observed: |
    {"data":{"detail":"Authentication credentials were not provided."},"code":"not_authenticated","main_error":"Authentication credentials were not provided."}
